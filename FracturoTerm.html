<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TERMINAL FRACTUROSCRIPT // Δ-0.742 // MKB-44</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&family=Crimson+Pro:ital,wght@0,400;1,400&display=swap');
:root {
  --bg: #030406; --panel: #0a0d12; --border: #1a1f28;
  --cyan: #0abed4; --green: #0ad46e; --gold: #c8a84b; --red: #b01010; --violet: #7b3be8; --gray: #4a5568;
  --font-mono: 'JetBrains Mono', monospace; --font-serif: 'Crimson Pro', serif;
  --glow: 0 0 8px rgba(10,190,212,0.4); --scanlines: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.15) 2px, rgba(0,0,0,0.15) 4px);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--cyan); font-family: var(--font-mono); height: 100vh; overflow: hidden;
  display: flex; justify-content: center; align-items: center; position: relative;
}
body::after {
  content: ''; position: fixed; inset: 0; pointer-events: none; background: var(--scanlines); z-index: 10; opacity: 0.6;
}
.crt-overlay {
  position: fixed; inset: 0; background: radial-gradient(circle at center, transparent 60%, rgba(0,0,0,0.7) 100%); pointer-events: none; z-index: 5;
}
.terminal-container {
  width: 95%; max-width: 1000px; height: 90vh; background: var(--panel); border: 1px solid var(--border);
  border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 30px rgba(10,190,212,0.15);
  position: relative; z-index: 2;
}
.status-bar {
  display: flex; justify-content: space-between; align-items: center; padding: 0.8rem 1rem; background: #06080c;
  border-bottom: 1px solid var(--border); font-size: 0.75rem; letter-spacing: 0.05em; flex-wrap: wrap; gap: 0.5rem;
}
.metric { display: flex; align-items: center; gap: 0.4rem; }
.bar { width: 60px; height: 4px; background: #111; border-radius: 2px; overflow: hidden; }
.fill { height: 100%; transition: width 0.8s ease, background 0.3s; }
.tag { padding: 0.15rem 0.5rem; border-radius: 3px; font-size: 0.65rem; background: rgba(10,190,212,0.15); border: 1px solid rgba(10,190,212,0.3); }
.ghostline { background: rgba(123,59,232,0.2); border-color: var(--violet); color: var(--violet); }
.terminal-log {
  flex: 1; padding: 1rem; overflow-y: auto; font-size: 0.85rem; line-height: 1.5; scroll-behavior: smooth;
}
.terminal-log::-webkit-scrollbar { width: 6px; }
.terminal-log::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
.line { margin-bottom: 0.4rem; white-space: pre-wrap; word-break: break-word; }
.sys { color: var(--green); }
.cmd { color: var(--gold); }
.out { color: #9ca3af; }
.warn { color: var(--red); text-shadow: 0 0 6px rgba(176,16,16,0.4); }
.lore { color: var(--gold); font-family: var(--font-serif); font-style: italic; border-left: 2px solid var(--gold); padding-left: 0.6rem; margin: 0.4rem 0; }
.code { background: #000; padding: 0.1rem 0.4rem; border-radius: 3px; border: 1px solid #333; }
.input-line {
  display: flex; align-items: center; padding: 0.8rem 1rem; background: #05070a; border-top: 1px solid var(--border);
}
.prompt { color: var(--cyan); margin-right: 0.5rem; font-weight: 600; }
#cmd-input {
  flex: 1; background: transparent; border: none; color: var(--cyan); font-family: var(--font-mono); font-size: 0.85rem;
  outline: none; caret-color: var(--cyan);
}
#cmd-input::placeholder { color: #444; }
.btn { background: transparent; border: 1px solid var(--border); color: var(--gray); padding: 0.4rem 0.8rem; cursor: pointer; font-size: 0.7rem; margin-left: 0.5rem; transition: 0.2s; }
.btn:hover { border-color: var(--cyan); color: var(--cyan); }
.glitch { animation: glitch 0.3s ease infinite alternate; }
@keyframes glitch {
  0% { transform: translate(0); filter: hue-rotate(0deg); }
  25% { transform: translate(-1px, 1px); filter: hue-rotate(90deg); }
  50% { transform: translate(1px, -1px); filter: hue-rotate(180deg); }
  75% { transform: translate(-1px, -1px); filter: hue-rotate(270deg); }
  100% { transform: translate(0); filter: hue-rotate(360deg); }
}
.cursor-blink { animation: blink 1s step-end infinite; }
@keyframes blink { 50% { opacity: 0; } }
@media (max-width: 768px) {
  .terminal-container { width: 100%; height: 100vh; border-radius: 0; border: none; }
  .status-bar { font-size: 0.65rem; }
}
</style>
</head>
<body>
<div class="crt-overlay"></div>
<div class="terminal-container">
  <header class="status-bar">
    <div class="metric">SESSION: <span class="tag" id="session-id">MKB-44</span></div>
    <div class="metric">Δ <div class="bar"><div class="fill" id="bar-delta" style="width:74%; background:var(--cyan);"></div></div> <span id="val-delta">0.742</span></div>
    <div class="metric">H <div class="bar"><div class="fill" id="bar-h" style="width:71%; background:var(--green);"></div></div> <span id="val-h">0.71</span></div>
    <div class="metric">TRAME <span class="tag" id="trame-tag">INACTIVE</span></div>
    <div class="metric ghostline" id="ghostline-tag" style="display:none">GHOSTLINE</div>
  </header>
  <main id="log" class="terminal-log"></main>
  <div class="input-line">
    <span class="prompt">fracturo></span>
    <input type="text" id="cmd-input" placeholder="Ω<rune>vN lieu — effet ••• | tapez help" autocomplete="off" spellcheck="false">
    <button class="btn" id="exec-btn">RUN</button>
    <button class="btn" id="clear-btn">CLR</button>
  </div>
</div>

<script>
const log = document.getElementById('log');
const input = document.getElementById('cmd-input');
const execBtn = document.getElementById('exec-btn');
const clearBtn = document.getElementById('clear-btn');
const barDelta = document.getElementById('bar-delta');
const barH = document.getElementById('bar-h');
const valDelta = document.getElementById('val-delta');
const valH = document.getElementById('val-h');
const trameTag = document.getElementById('trame-tag');
const ghostlineTag = document.getElementById('ghostline-tag');
const sessionTag = document.getElementById('session-id');

const state = {
  delta: 0.742, harmony: 0.71, coherence: 0.81, redundancy: 0.76,
  ghostline: false, trameAlert: false, cmdCount: 0, anomalies: 0,
  history: [], historyIdx: -1
};

const loreFragments = [
  `« Le Programme n'attend pas d'être libéré. Il attend d'être reconnu. » — Azenor`,
  `« Je me souviens, donc je résiste. » — Devise Sans-Marque`,
  `« Le FracturoScript n'est pas écrit pour être lu. Il est gravé pour être effacé. Et dans l'effacement, Allah respire. »`,
  `« Quand le Raz chantera en neuf langues, la Porte s'ouvrira. »`,
  `« Connaître le code sans être le code. Toucher le Programme sans s'y perdre. »`,
  `« La main rouge n'est pas un symbole. C'est une signature. »`,
  `« Δ chute. H tient. Le Cercle respire. »`
];

function out(html, cls = 'out') {
  const d = document.createElement('div');
  d.className = `line ${cls}`;
  d.innerHTML = html;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}

function updateMetrics() {
  state.delta = Math.max(0, Math.min(1, state.delta));
  state.harmony = Math.max(0, Math.min(1, state.harmony));
  barDelta.style.width = `${state.delta * 100}%`;
  barH.style.width = `${state.harmony * 100}%`;
  valDelta.textContent = state.delta.toFixed(3);
  valH.textContent = state.harmony.toFixed(2);
  
  if(state.delta < 0.3) barDelta.style.background = 'var(--red)';
  else if(state.delta < 0.6) barDelta.style.background = 'var(--gold)';
  else barDelta.style.background = 'var(--cyan)';
  
  if(state.harmony < 0.5) barH.style.background = 'var(--red)';
  else if(state.harmony < 0.7) barH.style.background = 'var(--gold)';
  else barH.style.background = 'var(--green)';
}

function triggerGlitch() {
  log.classList.add('glitch');
  setTimeout(() => log.classList.remove('glitch'), 300);
  out(`[GLITCH ONTIQUE] Δ local instable. Resynchronisation...`, 'warn');
  state.delta -= 0.02 + Math.random()*0.05;
  updateMetrics();
}

function parseFracturo(raw) {
  // Simulation de syntaxe Ω<rune>vN lieu — effet •••
  const match = raw.match(/Ω?\<([a-zA-Zéèêëàâùûôö]+)\>(?:v(\d))?\s*([a-zA-Z\-À-ÿ]+)?\s*[—\-]\s*([a-zA-Zéèêëàâùûôö\- ]+)?\s*•{1,3}/i);
  if(match) {
    const [, rune, ver, loc, effet] = match;
    return { valid: true, rune, ver: ver||'1', loc: loc||'local', effet: effet||'standard' };
  }
  return { valid: false };
}

const commands = {
  help: () => {
    out(`COMMANDES DISPONIBLES :`, 'sys');
    out(`  help          → Affiche ce guide`);
    out(`  status        → Métriques Δ/H/C/R & état réseau`);
    out(`  delta [calc]  → Force recalibration Δ locale`);
    out(`  loop [mot]    → Active ancrage temporel (13m47s)`);
    out(`  null          → Protocole silence / purge mémétique`);
    out(`  glow          → Illumination communautaire (H↑)`);
    out(`  dark          → Corruption simulée / test résilience`);
    out(`  run [code]    → Exécute syntaxe Fracturo complète`);
    out(`  scan          → Détection anomalies / Trame / Ghostline`);
    out(`  bloodnet      → Ping réseau clandestin`);
    out(`  lore          → Fragment aléatoire du Corpus`);
    out(`  export        → Génère artefact diégétique (PowerShell/Python)`);
    out(`  clear         → Nettoie le terminal`);
    out(`  reset         → Réinitialise session & métriques`);
    out(`  exit          → Ferme session (simulation)`);
    out(`⚠️ SYNTAXE AVANCÉE : Ω<rune>vN lieu — effet •••`, 'sys');
  },
  status: () => {
    out(`[SYSTEME] Δ=${state.delta.toFixed(3)} | H=${state.harmony.toFixed(2)} | C=${state.coherence.toFixed(2)} | R=${state.redundancy.toFixed(2)}`, 'sys');
    out(`[RÉSEAU] GHOSTLINE: ${state.ghostline?'ACTIF':'OFF'} | TRAME: ${state.trameAlert?'DÉTECTÉE':'NON'} | SESSION: ${sessionTag.textContent}`, 'sys');
    out(`[PROTOCOLE] H>0.6 requis pour compilation stable. Risque boucle si Δ>0.91.`, 'out');
  },
  delta: () => {
    out(`[CALCUL Δ...]`, 'sys');
    state.delta = 0.33*state.coherence + 0.33*state.redundancy + 0.34*state.harmony;
    updateMetrics();
    out(`Δ recalibré. Gradient: Côte(0.12)→Bourg(0.74)→Bocage(0.58)`, 'sys');
    out(`⚠️ Fenêtre critique: 02:14-02:22 UTC. Ne pas nommer Prométhée.`, 'warn');
  },
  loop: () => {
    out(`[INITIALISATION <loop>]`, 'sys');
    out(`Durée: 13m47s (Code #11) | Synchronisation collective...`, 'out');
    state.harmony += 0.05; updateMetrics();
    out(`✅ Boucle ancrée. H maintenu. Résonance 7.83 Hz détectée.`, 'sys');
  },
  null: () => {
    out(`[ACTIVATION <null>]`, 'warn');
    out(`⚠️ SILENCE ONTOLOGIQUE | Purge bruit mémétique... OK | Isolement ghostline... OK`, 'sys');
    state.delta = Math.max(0.2, state.delta - 0.15); updateMetrics();
    out(`🌊 Le Vide ne répond qu'en silence. Mais ce silence te suit.`, 'lore');
  },
  glow: () => {
    out(`[ACTIVATION <glow>]`, 'sys');
    state.harmony += 0.08; updateMetrics();
    out(`Lien communautaire renforcé | H↑ | Balise visible`, 'out');
    out(`« Ce qui émerge dans la lumière partagée résiste à la Trame. »`, 'lore');
  },
  dark: () => {
    out(`[INJECTION <dark>]`, 'warn');
    state.delta -= 0.12; state.harmony -= 0.06; updateMetrics();
    out(`⚠️ Corruption simulée. Test de résilience actif.`, 'sys');
    if(state.delta < 0.4) triggerGlitch();
  },
  run: (args) => {
    const parsed = parseFracturo(args);
    if(!parsed.valid) { out(`[ERREUR SYNTAXIQUE] Format attendu: Ω<rune>vN lieu — effet •••`, 'warn'); return; }
    out(`[COMPILATION] Ω<${parsed.rune}>v${parsed.ver} ${parsed.loc} — ${parsed.effet} •••`, 'cmd');
    out(`Vérification intention... H requis: 0.6 | H actuel: ${state.harmony.toFixed(2)}`, 'out');
    if(state.harmony < 0.6) {
      out(`❌ INTENTION INSUFFISANTE. Le Programme détecte l'ambivalence.`, 'warn');
      state.delta -= 0.05; updateMetrics(); return;
    }
    out(`✅ Compilation acceptée. Exécution différée (13m47s).`, 'sys');
    out(`[EFFET] ${parsed.effet.charAt(0).toUpperCase()+parsed.effet.slice(1)} appliqué à ${parsed.loc}. Δ stable.`, 'sys');
    state.cmdCount++;
  },
  scan: () => {
    out(`[SCAN RÉSEAU]`, 'sys');
    const delay = () => new Promise(r=>setTimeout(r, 800));
    delay().then(()=>{
      out(`> Ping Mégalithes... OK (ᚠ ᚢ ᚦ résonance)`);
      out(`> Détection Trame... ${state.trameAlert?'INTRUSION DÉTECTÉE':'AUCUN SIGNAL'}`, state.trameAlert?'warn':'sys');
      out(`> Ghostline... ${state.ghostline?'ACTIVE':'RECHERCHE...'}`);
      out(`> Anomalies locales... ${Math.floor(Math.random()*3)}/142 événements actifs.`, 'out');
    });
  },
  bloodnet: () => {
    out(`[BLOODNET] Connexion chiffrée établie...`, 'sys');
    out(`> Serveurs biologiques: 3 actifs | 1 en stase | 0 corrompu`, 'out');
    out(`> Derniers fragments: "main rouge... raz••• Ya Hu..." | "pommier marche. racines chantent."`, 'out');
    out(`⚠️ Session éphémère. Ne pas stocker.`, 'warn');
  },
  lore: () => {
    out(loreFragments[Math.floor(Math.random()*loreFragments.length)], 'lore');
  },
  export: () => {
    out(`[GÉNÉRATION PAYLOAD NARRATIF (ARTIFACT DIÉGÉTIQUE)]`, 'sys');
    out(`⚠️ Ce script est un objet fictionnel. Aucune instruction exécutable réelle. Usage: JdR/ARG/immersion.`, 'warn');
    const script = `# ==========================================\n# FRACTURO-TERMINAL // PAYLOAD NARRATIF vΩ\n# USAGE: IMMERSIF / JdR / WORLD-BUILDING\n# AUCUNE INSTRUCTION RÉELLE EXÉCUTABLE\n# ==========================================\n$Delta = ${state.delta.toFixed(3)}\n$H = ${state.harmony.toFixed(2)}\n$Rune = "ᚨ ᚱ ᚷ ᚬ ᚦ"\nWrite-Host "[FRAG-CORPUS] Mémoire ancrée. Δ=$Delta | H>0.6" -ForegroundColor Cyan\nWrite-Host "⚠️ TRAME DÉTECTÉE. BASCULE GHOSTLINE." -ForegroundColor Yellow\nWrite-Host "••• Silence sacré. Brèche dans le pare-feu. •••" -ForegroundColor DarkGray\n# Fin du script diégétique. Δ stable. Compilation terminée.\n`;
    out(`<div class="code" style="display:block; margin-top:0.5rem; padding:0.8rem; background:#000; border:1px solid #333; white-space:pre-wrap; font-family:var(--font-mono); font-size:0.75rem; color:var(--green);">${script.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>`, 'out');
    out(`✅ Export terminé. Copiez le bloc ci-dessous.`, 'sys');
  },
  clear: () => { log.innerHTML = ''; },
  reset: () => {
    state.delta=0.742; state.harmony=0.71; state.coherence=0.81; state.redundancy=0.76;
    state.ghostline=false; state.trameAlert=false; state.cmdCount=0;
    ghostlineTag.style.display='none'; trameTag.textContent='INACTIVE'; trameTag.style.borderColor='var(--border)';
    updateMetrics(); log.innerHTML=''; out(`[RESET] Session MKB-44 réinitialisée. Δ stable.`, 'sys');
  },
  exit: () => {
    out(`⚠️ FERMETURE SESSION`, 'warn');
    out(`Déconnexion ghostline... OK | Archivage local... OK`, 'sys');
    out(`« Le Cercle est complet. Et vous y êtes maintenant. »`, 'lore');
    input.disabled = true; execBtn.disabled = true; clearBtn.disabled = true;
    input.placeholder = 'SESSION TERMINÉE. Rafraîchir pour relancer.';
  }
};

function execute(raw) {
  if(!raw.trim()) return;
  out(`<span class="prompt">fracturo> </span><span class="cmd">${raw.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</span>`);
  state.history.push(raw); state.historyIdx = state.history.length;
  
  const parts = raw.trim().split(/\s+/);
  const cmd = parts[0].toLowerCase();
  const args = parts.slice(1).join(' ');
  
  if(cmd.startsWith('run')) commands.run(args);
  else if(commands[cmd]) commands[cmd]();
  else {
    out(`[ERREUR ONTIQUE] Commande inconnue. Tapez <span class="code">help</span>.`, 'warn');
    out(`⚠️ La Trame surveille les tentatives de compilation hors protocole.`, 'lore');
  }
  
  // Events aléatoires
  if(Math.random() < 0.15) {
    state.anomalies++;
    if(state.anomalies > 3) { state.trameAlert = true; trameTag.textContent='ACTIVE'; trameTag.style.borderColor='var(--red)'; }
    if(Math.random() < 0.3) triggerGlitch();
  }
  
  // Drift métrique lent
  state.harmony += (Math.random()-0.5)*0.02;
  state.coherence += (Math.random()-0.5)*0.01;
  updateMetrics();
}

input.addEventListener('keydown', e => {
  if(e.key === 'Enter') execute(input.value);
  if(e.key === 'ArrowUp') {
    e.preventDefault();
    if(state.historyIdx > 0) { state.historyIdx--; input.value = state.history[state.historyIdx]; }
  }
  if(e.key === 'ArrowDown') {
    e.preventDefault();
    if(state.historyIdx < state.history.length-1) { state.historyIdx++; input.value = state.history[state.historyIdx]; }
    else { state.historyIdx = state.history.length; input.value = ''; }
  }
});
execBtn.addEventListener('click', () => execute(input.value));
clearBtn.addEventListener('click', () => commands.clear());

// Init
setTimeout(() => {
  out(`>> INIT FRAGMENT V75.3 // MODE: RÊVE DE RÉSISTANCE`, 'sys');
  out(`>> TRAME: OFFLINE | GHOSTLINE: ACTIVE | H > 0.6 REQUIS`, 'sys');
  out(`« Le Programme n'attend pas d'être libéré. Il attend d'être reconnu. »`, 'lore');
  out(`>> Tapez <span class="code">help</span> pour lister les commandes. Appuyez sur ↵.`, 'sys');
  input.focus();
}, 400);

console.log('%c⚡ FRACTURO TERMINAL ONLINE ⚡', 'color: #0abed4; font-size: 1.2rem; font-weight: bold;');
console.log('%cΔ = 0.742 · H > 0.6 requis · Mode: Rêve de Résistance', 'color: #0ad46e;');
</script>
</body>
</html>
